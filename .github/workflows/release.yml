# Makes a release on request: Actions › release › Run workflow (on main).
# Checks the version, runs all tests, builds the archive and the .deb and .rpm packages and
# creates the tag vVERSION with a GitHub release (archive, packages, SHA256SUMS, signed build
# provenance, notes from CHANGELOG.md).
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 0.1.0 (empty: the VERSION in src/app.js)"
        required: false
        default: ""
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: false

permissions:
  contents: write       # tag and release
  id-token: write       # signing the build provenance
  attestations: write   # storing the build provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases are made from main only (this run: $GITHUB_REF)."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          code=$(sh tools/check-version.sh)
          version=${INPUT_VERSION:-$code}
          version=${version#v}
          if ! printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::\"$version\" is not a version like 0.1.0."
            exit 1
          fi
          if [ "$version" != "$code" ]; then
            echo "::error::Version $version differs from VERSION in src/app.js ($code). Change src/app.js first."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "::error::Tag v$version exists already."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Offline tests
        run: make check
      - name: Install Playwright
        run: pip install -r test/requirements.txt
      # Only the browser, two tries of four minutes, as in the test workflow: the system packages
      # of --with-deps come from the Ubuntu mirror, which once hung for twelve minutes.
      - name: Browser (Chromium from Playwright's CDN, two tries)
        timeout-minutes: 10
        run: |
          for try in 1 2; do
            timeout --kill-after=10s 4m python -m playwright install chromium && exit 0
            echo "::warning::playwright install failed or hung (try $try)"
          done
          exit 1
      - name: Browser tests
        run: make check-ui

      - name: Package (archive, .deb, .rpm)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends rpm > /dev/null
          make package
          make packages
          (cd dist && sha256sum *.deb *.rpm) >> SHA256SUMS

      - name: Build provenance for the packages
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            cockpit-status-board-${{ steps.version.outputs.version }}.tar.gz
            dist/*.deb
            dist/*.rpm

      - name: Release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tools/release-notes.sh "$VERSION" > notes.md
          deb=cockpit-status-board_$(printf '%s' "$VERSION" | tr '-' '~')-1_all.deb
          rpm=cockpit-status-board-$(printf '%s' "$VERSION" | tr '-' '~')-1.noarch.rpm
          {
            echo
            echo "### Install"
            echo
            echo "Status Board belongs on the Cockpit host from which the others are reached (the one with the host switcher); the other hosts need only the add-ons themselves."
            echo
            echo "Download the package and \`SHA256SUMS\`, check that the download is complete and that this repository's release workflow built it, then install it:"
            echo
            echo '```sh'
            echo "sha256sum --ignore-missing -c SHA256SUMS"
            echo "gh attestation verify <file> --repo $GITHUB_REPOSITORY"
            echo
            echo "sudo apt install ./$deb                              # Debian, Ubuntu"
            echo "sudo dnf install ./$rpm                           # Fedora, RHEL"
            echo '```'
            echo
            echo "The \`.rpm\` carries no package signature; the two checks take its place. The tests install the packages on Debian 13 and Fedora 43 only."
            echo
            echo "Other systems: \`sudo tar -xzf cockpit-status-board-$VERSION.tar.gz -C /usr/share/cockpit\`."
          } >> notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -- --target "$GITHUB_SHA" --title "Status Board $VERSION" --notes-file notes.md
          if [ "$PRERELEASE" = "true" ]; then
            set -- "$@" --prerelease
          fi
          gh release create "v$VERSION" "cockpit-status-board-$VERSION.tar.gz" dist/*.deb dist/*.rpm SHA256SUMS "$@"
