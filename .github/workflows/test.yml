name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Everything that runs without a server: lint, the offline tests, the archive and the packages
  # (each built twice to the same bytes), the packages installed on Debian and Fedora (on Rocky
  # Linux and AlmaLinux: job install), and the page in a browser against a stand-in for Cockpit.
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Check tools (pinned in test/requirements.txt)
        run: pip install -r test/requirements.txt
      - name: Lint (shellcheck, ruff)
        run: make lint
      # test/status.test.js: the status contract against good, broken and hostile answers in
      # test/fixtures (schema, lengths, invisible characters, links, package folders, commands
      # below /usr/lib/cockpit-, the host switcher's list, the tiles of the board);
      # test/i18n.test.js: every text in English and German, no German in English;
      # test/page.test.js: no HTML from strings, nothing the CSP blocks, no administrative
      # access, no watch(), only find and the status verb; then the shared design files
      # (tools/check-design-files.sh) and version, ?v= and changelog (tools/check-version.sh).
      - name: Offline tests (status contract against the fixtures, texts, page files, design files, version)
        run: make check
      - name: Archive (with LICENSE and NOTICE, built twice to the same bytes) and changelog for the current version
        run: |
          make package
          version=$(sh tools/check-version.sh)
          archive=cockpit-status-board-$version.tar.gz
          for f in LICENSE NOTICE; do
            tar -xzOf "$archive" "status-board/$f" | cmp - "$f"
            tar -tvzf "$archive" "status-board/$f" | grep -q '^-rw-r--r-- 0/0 '
            grep -qx "$(sha256sum < "$f" | cut -d ' ' -f 1)  status-board/$f" SHA256SUMS
          done
          sha256sum "$archive" > "$RUNNER_TEMP/archive.sha256"
          rm -f "$archive" SHA256SUMS
          make package > /dev/null
          sha256sum -c "$RUNNER_TEMP/archive.sha256"
      - name: Packages (.deb, .rpm) with valid AppStream data, built twice to the same bytes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends rpm appstream > /dev/null
          appstreamcli validate --no-net packaging/*.metainfo.xml
          make packages
          (cd dist && sha256sum *.deb *.rpm) > first.sha256
          rm -rf dist && make packages > /dev/null
          (cd dist && sha256sum -c ../first.sha256)
      - name: Install and remove the .deb on Debian and the .rpm on Fedora
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" debian:13 sh -ec '
            apt-get update -qq
            apt-get install -y -qq /dist/*.deb > /dev/null
            test -f /usr/share/cockpit/status-board/manifest.json
            test -f /usr/share/cockpit/status-board/lib/status.js
            test -f /usr/share/metainfo/de.azentrius.status_board.metainfo.xml
            dpkg -L cockpit-status-board | grep -qx /usr/share/doc/cockpit-status-board/CC-BY-4.0-Font-Awesome.txt
            apt-get remove -y -qq cockpit-status-board > /dev/null
            test ! -e /usr/share/cockpit/status-board'
          docker run --rm -v "$PWD/dist:/dist:ro" fedora:43 sh -ec '
            dnf install -y -q /dist/*.rpm
            rpm -V cockpit-status-board
            test -f /usr/share/cockpit/status-board/manifest.json
            dnf remove -y -q cockpit-status-board
            test ! -e /usr/share/cockpit/status-board'
      # Only the browser, from Playwright's CDN (seconds). Its system packages (--with-deps: fonts,
      # xvfb) come by apt from the Ubuntu mirror, which once took twelve minutes for them and cut a
      # job off at its time limit (Azentrius/cockpit-cronjobs#85). The runner image brings what
      # Chromium needs (it has Google Chrome); the browser tests show if anything is missing. Each
      # try gets four minutes, a hung one a second try.
      - name: Browser (Chromium from Playwright's CDN, two tries)
        timeout-minutes: 10
        run: |
          for try in 1 2; do
            timeout --kill-after=10s 4m python -m playwright install chromium && exit 0
            echo "::warning::playwright install failed or hung (try $try)"
          done
          exit 1
      # test/ui_test.py against test/web/mock-cockpit.js, served with Cockpit's CSP: the board of
      # the fixtures' hosts, hostile and broken answers, hosts that cannot be reached, a locked
      # key, a timeout, the reload every 5 minutes, English and German, dark, a phone.
      - name: Browser tests (the page against a stand-in for Cockpit, with Cockpit's CSP)
        run: make check-ui
      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: test/shots/

  # The .rpm on the RHEL rebuilds Rocky Linux and AlmaLinux, 9 and 10, beyond the test job's
  # Debian 13 and Fedora 43: installed with the distribution's own Cockpit (its version is
  # printed), the files as the package database has them, the removal. No Cockpit runs there, so
  # an installed package is not yet a tested system.
  install:
    name: install (${{ matrix.image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: ["rockylinux/rockylinux:9", "rockylinux/rockylinux:10", "almalinux:9", "almalinux:10"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends rpm > /dev/null
          make packages
      - name: Install, check and remove on ${{ matrix.image }}
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" "$IMAGE" sh -ec '
            . /etc/os-release
            echo "$PRETTY_NAME"
            dnf install -y -q /dist/*.rpm
            rpm -q cockpit-bridge
            rpm -V cockpit-status-board
            test -f /usr/share/cockpit/status-board/manifest.json
            test -f /usr/share/cockpit/status-board/lib/status.js
            test -f /usr/share/metainfo/de.azentrius.status_board.metainfo.xml
            rpm -ql cockpit-status-board | grep -qx /usr/share/doc/cockpit-status-board/CC-BY-4.0-Font-Awesome.txt
            dnf remove -y -q cockpit-status-board
            test ! -e /usr/share/cockpit/status-board'

  # The board against a real Cockpit on the runner's throwaway VM, for what the stand-in can only
  # imitate: the host switcher's list from the bridge, the bridge's channels to other hosts over
  # SSH and their shared connection, a locked key, a closed port, the shell's jumps. The other
  # hosts are this machine under three names, over an SSH server of its own on port 2022 (test/e2e/).
  # These steps are the setup that test/e2e_cockpit.py expects; they change the machine.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # Cockpit from the backports, as Cockpit recommends for Ubuntu (the release itself has an old one).
      - name: Install Cockpit, the SSH server and the test add-on
        run: |
          . /etc/os-release
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -t "$VERSION_CODENAME-backports" cockpit-ws cockpit-bridge cockpit-system
          sudo apt-get install -y --no-install-recommends openssh-server
          dpkg-query -W cockpit-ws cockpit-bridge openssh-server
          sudo ln -sfn "$GITHUB_WORKSPACE/src" /usr/share/cockpit/status-board
          sudo install -d /usr/share/cockpit/e2e /usr/lib/cockpit-e2e
          sudo install -m 644 test/e2e/addon/manifest.json test/e2e/addon/index.html test/e2e/addon/probe.js /usr/share/cockpit/e2e/
          sudo install -m 755 test/e2e/addon/status /usr/lib/cockpit-e2e/status
          /usr/lib/cockpit-e2e/status status --lang en | python -m json.tool
      - name: Check tools (pinned in test/requirements.txt)
        run: pip install -r test/requirements.txt
      # Only the browser, two tries of four minutes (see the job test).
      - name: Browser (Chromium from Playwright's CDN, two tries)
        timeout-minutes: 10
        run: |
          for try in 1 2; do
            timeout --kill-after=10s 4m python -m playwright install chromium && exit 0
            echo "::warning::playwright install failed or hung (try $try)"
          done
          exit 1
      # Three names for this machine, as three hosts in the host switcher. The runner's user logs
      # in with a key that is only in the ssh-agent; e2elocked only with the encrypted key
      # ~/.ssh/id_ed25519, which is not in the agent (as after "ssh-add -D" on the bastion).
      # Nothing listens on port 2023.
      - name: SSH server on 127.0.0.1:2022, keys, ssh-agent, known host keys
        run: |
          echo "127.0.0.1 e2e-peer e2e-locked e2e-closed" | sudo tee -a /etc/hosts > /dev/null
          sudo useradd -m -s /bin/sh e2elocked
          test ! -e ~/.ssh/id_ed25519
          install -d -m 700 ~/.ssh
          ssh-keygen -q -t ed25519 -N '' -C e2e-agent -f "$RUNNER_TEMP/agent-key"
          ssh-keygen -q -t ed25519 -N 'not in the agent' -C e2e-locked -f ~/.ssh/id_ed25519
          sudo install -d -m 755 /etc/ssh/e2e-keys
          sudo install -m 644 "$RUNNER_TEMP/agent-key.pub" "/etc/ssh/e2e-keys/$(id -un)"
          sudo install -m 644 ~/.ssh/id_ed25519.pub /etc/ssh/e2e-keys/e2elocked
          sudo ssh-keygen -A
          sudo install -d -m 755 /run/sshd
          # created by this user, so that the test can read what sshd (root) appends
          : > "$RUNNER_TEMP/sshd.log"
          sudo /usr/sbin/sshd -t -f "$GITHUB_WORKSPACE/test/e2e/sshd_config"
          sudo /usr/sbin/sshd -f "$GITHUB_WORKSPACE/test/e2e/sshd_config" -E "$RUNNER_TEMP/sshd.log"
          for i in $(seq 50); do
            if (exec 3<>/dev/tcp/127.0.0.1/2022) 2>/dev/null; then break; fi
            sleep 0.2
          done
          ssh-keyscan -p 2022 -t ed25519 e2e-peer e2e-locked >> ~/.ssh/known_hosts
          grep -q '^\[e2e-locked\]:2022 ' ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          ssh-add -q "$RUNNER_TEMP/agent-key"
          rm "$RUNNER_TEMP/agent-key"
          ssh-add -l
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          # what the bridge will meet: the agent's key logs in (and the login prints nothing but
          # the command's output), the locked key does not without its passphrase, port 2023 is closed
          test "$(ssh -p 2022 -o BatchMode=yes e2e-peer echo ok)" = ok
          if ssh -p 2022 -o BatchMode=yes e2elocked@e2e-locked true; then
            echo "::error::e2elocked logged in without the passphrase"; exit 1
          fi
          if (exec 3<>/dev/tcp/127.0.0.1/2023) 2>/dev/null; then
            echo "::error::port 2023 is open"; exit 1
          fi
      # This user's own Cockpit without login, as cockpit-desktop runs it: its bridge has the
      # ssh-agent and reads the host switcher's list from machines.d. AllowMultiHost lets the
      # shell open the add-on on another host.
      - name: Start Cockpit as this user, without login
        run: |
          printf '[WebService]\nAllowMultiHost = true\n' | sudo tee /etc/cockpit/cockpit.conf > /dev/null
          sudo install -d /etc/cockpit/machines.d
          sudo install -m 644 test/e2e/99-webui.json /etc/cockpit/machines.d/99-webui.json
          # the bridge's SSH (ferny) keeps its control socket in XDG_RUNTIME_DIR, else in /run
          if [ -z "${XDG_RUNTIME_DIR:-}" ] || [ ! -w "$XDG_RUNTIME_DIR" ]; then
            export XDG_RUNTIME_DIR="$RUNNER_TEMP/runtime"
            install -d -m 700 "$XDG_RUNTIME_DIR"
          fi
          # the bridge's steps towards the other hosts in the log
          COCKPIT_DEBUG=cockpit.remote /usr/lib/cockpit/cockpit-ws --no-tls --port 9091 --address 127.0.0.1 \
            --local-session=cockpit-bridge > "$RUNNER_TEMP/cockpit-ws.log" 2>&1 &
          for i in $(seq 100); do
            if (exec 3<>/dev/tcp/127.0.0.1/9091) 2>/dev/null; then exit 0; fi
            sleep 0.2
          done
          cat "$RUNNER_TEMP/cockpit-ws.log"
          exit 1
      - name: End-to-end test
        run: python test/e2e_cockpit.py
      - name: Logs
        if: failure()
        run: |
          cat "$RUNNER_TEMP/cockpit-ws.log" || true
          cat "$RUNNER_TEMP/sshd.log" || true
          ss -tn || true
          ps -eo pid,user,args | grep -E '[s]sh|[c]ockpit' || true
          ssh-add -l || true
          ls -la ~/.ssh || true
      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-screenshots
          path: test/shots/

  # The same test on the RHEL rebuilds, in a Rocky Linux VM with SELinux enforcing (tools/vm.sh:
  # the pinned cloud image under KVM on this runner), with the .rpm of this build and the
  # distribution's Cockpit. The setup of the job e2e happens in the machine, and the test runs
  # there as the machine's user ci, who is not root. Its Cockpit runs as ci without login, from a
  # copy of cockpit-ws (the original's label would take it into the web server's confined domain),
  # so the bridge runs as ci in the domain of a user who logged in, with the ssh-agent, as on a
  # bastion. SELinux lets sshd bind port 2022 once the port has the type ssh_port_t (semanage, as
  # for any SSH server on another port). The browser stays on this runner behind a Playwright
  # server bound to 127.0.0.1, which an SSH tunnel brings into the machine; the machine's port 9091
  # is forwarded here. The test fails on every SELinux denial between its mark and its end. A
  # pilot: not yet a required check.
  e2e-el:
    name: e2e (${{ matrix.os }}, SELinux enforcing)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: rocky-9, python: python3.12 }
          - { os: rocky-10, python: python3 }
    env:
      VM_PORTS: "9091"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: The package of this build, QEMU and cloud-init's seed tool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends rpm qemu-system-x86 qemu-utils cloud-image-utils > /dev/null
          make packages
      - name: Check tools (pinned in test/requirements.txt)
        run: pip install -r test/requirements.txt
      # Only the browser, two tries of four minutes (see the job test).
      - name: Browser (Chromium from Playwright's CDN, two tries)
        timeout-minutes: 10
        run: |
          for try in 1 2; do
            timeout --kill-after=10s 4m python -m playwright install chromium && exit 0
            echo "::warning::playwright install failed or hung (try $try)"
          done
          exit 1
      - name: KVM for the runner's user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Which cloud image
        id: image
        env:
          OS: ${{ matrix.os }}
        run: echo "name=$(sh tools/vm.sh image "$OS")" >> "$GITHUB_OUTPUT"
      - name: The cloud image (kept between runs by its pinned name; tools/vm.sh checks its SHA-256)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/azentrius-vm
          key: vm-${{ steps.image.outputs.name }}
      - name: Boot ${{ matrix.os }} (tools/vm.sh)
        env:
          OS: ${{ matrix.os }}
        run: sh tools/vm.sh start "$OS"
      # The job e2e's setup as root in the machine, with the package instead of src/: the test
      # add-on, AllowMultiHost, the host switcher's list, the three names, the user e2elocked and
      # the SSH server's port and configuration. Linger keeps ci's runtime folder, and with it the
      # ssh-agent and Cockpit below, between the steps. The script goes in on standard input.
      - name: Cockpit, the package, the test add-on, the hosts and Playwright in the machine
        env:
          PY: ${{ matrix.python }}
        run: |
          sh tools/vm.sh root install -d -o ci -g ci /home/ci/sb
          tar -cf - test/e2e_cockpit.py test/e2e | sh tools/vm.sh root runuser -u ci -- tar -C /home/ci/sb -xf -
          sh tools/vm.sh copy /root/sb dist/*.rpm
          sh tools/vm.sh root env PY="$PY" PLAYWRIGHT="$(grep '^playwright==' test/requirements.txt)" sh -es << 'EOF'
          dnf install -y -q cockpit-ws cockpit-bridge cockpit-system openssh-server iproute policycoreutils-python-utils "$PY"
          dnf install -y -q /root/sb/cockpit-status-board-*.rpm
          rpm -q cockpit-status-board cockpit-ws cockpit-bridge openssh-server selinux-policy-targeted
          e=/home/ci/sb/test/e2e
          install -d /usr/share/cockpit/e2e /usr/lib/cockpit-e2e
          install -m 644 "$e/addon/manifest.json" "$e/addon/index.html" "$e/addon/probe.js" /usr/share/cockpit/e2e/
          install -m 755 "$e/addon/status" /usr/lib/cockpit-e2e/status
          printf '[WebService]\nAllowMultiHost = true\n' > /etc/cockpit/cockpit.conf
          install -d /etc/cockpit/machines.d
          install -m 644 "$e/99-webui.json" /etc/cockpit/machines.d/99-webui.json
          echo "127.0.0.1 e2e-peer e2e-locked e2e-closed" >> /etc/hosts
          useradd -m -s /bin/sh e2elocked
          semanage port -a -t ssh_port_t -p tcp 2022
          install -m 644 "$e/sshd_config" /etc/ssh/sshd_config-e2e
          install -d -m 755 /etc/ssh/e2e-keys
          ssh-keygen -A
          install -m 755 /usr/libexec/cockpit-ws /usr/local/bin/cockpit-ws-e2e
          if systemctl is-active --quiet firewalld; then firewall-cmd -q --add-port=9091/tcp; fi
          loginctl enable-linger ci
          runuser -u ci -- "$PY" -m venv /home/ci/sb/venv
          runuser -u ci -- /home/ci/sb/venv/bin/pip install -q "$PLAYWRIGHT"
          EOF
      # As in the job e2e, with ci for the runner's user: ci logs in with a key that is only in its
      # ssh-agent, e2elocked only with the encrypted key ~/.ssh/id_ed25519, which is not in the
      # agent; nothing listens on port 2023. Then ci's Cockpit, which has the agent.
      - name: Keys, the SSH server on 127.0.0.1:2022, the ssh-agent and Cockpit as ci in the machine
        run: |
          sh tools/vm.sh root runuser -u ci -- sh -es << 'EOF'
          test ! -e ~/.ssh/id_ed25519
          install -d -m 700 ~/.ssh
          ssh-keygen -q -t ed25519 -N '' -C e2e-agent -f ~/sb/agent-key
          ssh-keygen -q -t ed25519 -N 'not in the agent' -C e2e-locked -f ~/.ssh/id_ed25519
          EOF
          sh tools/vm.sh root sh -es << 'EOF'
          install -m 644 /home/ci/sb/agent-key.pub /etc/ssh/e2e-keys/ci
          install -m 644 /home/ci/.ssh/id_ed25519.pub /etc/ssh/e2e-keys/e2elocked
          # the test counts the logins in this log; ci reads it
          install -m 644 /dev/null /var/log/sshd-e2e.log
          /usr/sbin/sshd -t -f /etc/ssh/sshd_config-e2e
          /usr/sbin/sshd -f /etc/ssh/sshd_config-e2e -E /var/log/sshd-e2e.log
          EOF
          sh tools/vm.sh root runuser -u ci -- sh -es << 'EOF'
          for _ in $(seq 50); do
              if ss -Htln '( sport = :2022 )' | grep -q .; then break; fi
              sleep 0.2
          done
          ssh-keyscan -p 2022 -t ed25519 e2e-peer e2e-locked >> ~/.ssh/known_hosts
          grep -q '^\[e2e-locked\]:2022 ' ~/.ssh/known_hosts
          XDG_RUNTIME_DIR="/run/user/$(id -u)"
          SSH_AUTH_SOCK="$XDG_RUNTIME_DIR/e2e-agent.sock"
          export XDG_RUNTIME_DIR SSH_AUTH_SOCK
          ssh-agent -a "$SSH_AUTH_SOCK" > /dev/null
          ssh-add -q ~/sb/agent-key
          rm ~/sb/agent-key
          ssh-add -l
          # what the bridge will meet: the agent's key logs in (and the login prints nothing but
          # the command's output), the locked key does not without its passphrase, port 2023 is
          # closed. ssh -n: this script is ssh's standard input otherwise.
          test "$(ssh -n -p 2022 -o BatchMode=yes e2e-peer echo ok)" = ok
          if ssh -n -p 2022 -o BatchMode=yes e2elocked@e2e-locked true; then
              echo "e2elocked logged in without the passphrase" >&2; exit 1
          fi
          if ss -Htln '( sport = :2023 )' | grep -q .; then
              echo "port 2023 is open" >&2; exit 1
          fi
          # the bridge's steps towards the other hosts in the log
          COCKPIT_DEBUG=cockpit.remote setsid nohup /usr/local/bin/cockpit-ws-e2e --no-tls --port 9091 --address 0.0.0.0 \
              --local-session=cockpit-bridge > ~/sb/cockpit-ws.log 2>&1 < /dev/null &
          for _ in $(seq 100); do
              if curl -fsS -o /dev/null http://127.0.0.1:9091/cockpit/@localhost/status-board/index.html; then exit 0; fi
              sleep 0.2
          done
          cat ~/sb/cockpit-ws.log
          exit 1
          EOF
          # and from here, as the browser will reach it (a script cut short would have ended well)
          curl -fsS -o /dev/null http://127.0.0.1:9091/cockpit/@localhost/status-board/index.html
      - name: The Playwright server here, tunnelled into the machine
        run: |
          nohup python -m playwright run-server --port 3333 --host 127.0.0.1 > "$RUNNER_TEMP/playwright-server.log" 2>&1 &
          up=0
          for _ in $(seq 1 50); do
            if (exec 3<>/dev/tcp/127.0.0.1/3333) 2> /dev/null; then up=1; break; fi
            sleep 0.2
          done
          if [ "$up" != 1 ]; then cat "$RUNNER_TEMP/playwright-server.log"; exit 1; fi
          sh tools/vm.sh back 3333
      - name: The SELinux check catches a denial on purpose; then the mark in the audit log
        run: |
          sh tools/vm.sh avc-selftest
          sh tools/vm.sh avc-mark
      - name: End-to-end test in the machine (as ci, the browser here)
        run: |
          sh tools/vm.sh root runuser -u ci -- sh -c "'cd /home/ci/sb && E2E_SSHD_LOG=/var/log/sshd-e2e.log PLAYWRIGHT_WS=ws://127.0.0.1:3333/ venv/bin/python test/e2e_cockpit.py'"
      - name: No SELinux denials during the test
        run: sh tools/vm.sh avc-check
      - name: Logs
        if: always()
        run: |
          mkdir -p e2e-el
          sh tools/vm.sh fetch e2e-el /home/ci/sb/test/shots || true
          sh tools/vm.sh fetch e2e-el /home/ci/sb/cockpit-ws.log || true
          sh tools/vm.sh fetch e2e-el /var/log/sshd-e2e.log || true
          sh tools/vm.sh logs e2e-el || true
          cp "$RUNNER_TEMP/playwright-server.log" e2e-el/ 2> /dev/null || true
      - name: Keep the screenshots and the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-${{ matrix.os }}
          path: e2e-el/

  # Secrets in the files and in the whole history (gitleaks, pinned with its checksum). The
  # findings are redacted in the log; GitHub's own secret scanning with push protection runs
  # as well (repository settings).
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks 8.21.2 over the history and the files
        run: |
          curl -fsSLo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/gitleaks" gitleaks
          rm gitleaks.tar.gz
          "$RUNNER_TEMP/gitleaks/gitleaks" git --redact --no-banner --verbose .
          "$RUNNER_TEMP/gitleaks/gitleaks" dir --redact --no-banner .
