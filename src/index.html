<!doctype html>
<!-- Status Board · SPDX-License-Identifier: Apache-2.0 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Status Board</title>
<!-- The shared Azentrius design files (identical in every add-on, tools/design-files.sha256):
     the theme script before the stylesheets, so the page never flashes in the wrong brightness.
     Every file of the add-on carries ?v=VERSION, so browsers fetch the new files after an update
     (tools/check-version.sh). Everything is local: Cockpit's strict CSP stays as it is. -->
<script src="azentrius-theme.js?v=0.2.3"></script>
<link rel="stylesheet" href="azentrius.css?v=0.2.3">
<link rel="stylesheet" href="app.css?v=0.2.3">
<!-- Cockpit: its API, its translation for the session language (sets cockpit.language), and the
     manifests of this host's packages (cockpit.manifests). -->
<script src="../base1/cockpit.js"></script>
<script src="../base1/po.js"></script>
<script src="../manifests.js"></script>
<script src="icons.js?v=0.2.3"></script>
<script src="i18n/en.js?v=0.2.3"></script>
<script src="i18n/de.js?v=0.2.3"></script>
<script src="lib/status.js?v=0.2.3"></script>
</head>
<body>
<div class="az-page" id="page">

  <header class="az-page-header">
    <h1 class="az-page-title az-page-title--dot" id="page-title" tabindex="-1">Status Board</h1>
    <div class="az-page-actions">
      <!-- The switch belongs to the tab "Hosts and coverage"; app.js hides it on the other one. -->
      <label class="az-switch" id="notable-wrap"><input type="checkbox" id="only-notable"><span class="az-switch__track"></span><span class="az-switch__label" data-t="onlyNotable">Only what needs attention</span></label>
      <span class="az-meta" id="meta"></span>
      <!-- Starts busy: the first load begins as soon as app.js runs. -->
      <button class="az-btn az-btn--primary" type="button" id="refresh" disabled aria-busy="true"><span data-icon="sync-alt"></span><span id="refresh-label" data-t="refreshing">Loading …</span></button>
    </div>
  </header>

  <div class="sb-alerts" id="alerts" aria-live="polite"></div>

  <!-- How many add-ons answered in time with something rated; filled by app.js, above both tabs and
       outside the switch. -->
  <section class="az-card sb-coverage" id="coverage" aria-labelledby="coverage-title" hidden></section>

  <!-- The two tabs; the selected one is part of the location (#/tasks, #/hosts). -->
  <div class="az-tabs" id="tabs" role="tablist" aria-label="Views" data-t-label="tabsLabel">
    <button class="az-tab" type="button" role="tab" id="tab-tasks" aria-controls="tasks" aria-selected="true"><span data-t="tabTasks">Needs attention</span><span class="sb-count" id="count-tasks"></span></button>
    <button class="az-tab" type="button" role="tab" id="tab-hosts" aria-controls="board" aria-selected="false" tabindex="-1"><span data-t="tabHosts">Hosts and coverage</span></button>
  </div>

  <div class="sb-tasks" id="tasks" role="tabpanel" aria-labelledby="tab-tasks" aria-busy="true">
    <p class="sb-note" data-t="loading">Loading …</p>
  </div>

  <div class="sb-board" id="board" role="tabpanel" aria-labelledby="tab-hosts" aria-busy="true" hidden>
    <p class="sb-note" data-t="loading">Loading …</p>
  </div>

  <footer class="az-signature">
    <a class="az-signature__mark" href="https://azentrius.com" target="_blank" rel="noopener noreferrer">Azentrius</a>
    <span class="az-signature__meta"><span id="sig-version">Status Board</span><span id="sig-host"></span><a href="https://github.com/Azentrius/cockpit-status-board" target="_blank" rel="noopener noreferrer" data-t="sourceCode">Source code</a></span>
  </footer>
</div>

<script src="app.js?v=0.2.3"></script>
</body>
</html>
