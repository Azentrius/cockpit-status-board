# What tools/build-packages.sh needs to know about this package (sourced by sh).
# SPDX-License-Identifier: Apache-2.0

NAME=cockpit-status-board
SUMMARY="Cockpit page: what needs attention across the Azentrius add-ons on every host"
DESCRIPTION="A tab Needs attention lists what to do on all hosts, each task with its reasons, its evidence and a button into the add-on. Each host shows how many of the add-ons it is expected to have were checked, its roles and expected checks from the target profile that Host Settings sends, a check the profile names that its add-on does not report, and as planned scope the areas the suite does not cover yet. The tab Hosts and coverage has one row per host and one tile per Azentrius add-on: its state, its most important figure and the age of its data; hosts that do not answer, locked SSH keys, add-ons missing on a host and data that is out of date show up as well. Read-only: it runs only each add-on's status verb and asks for no administrative access. Meant for the Cockpit host that reaches the others; it takes its hosts from Cockpit's host switcher, which Cockpit has deprecated, and opens an add-on on another host only with AllowMultiHost."
HOMEPAGE=https://github.com/Azentrius/cockpit-status-board
MAINTAINER="Azentrius <support@azentrius.com>"
LICENSE="Apache-2.0 AND OFL-1.1 AND CC-BY-4.0"

# One dependency per line. The page runs in Cockpit and needs nothing else here; the hosts it
# shows need cockpit-bridge and the add-ons, not this package.
DEB_DEPENDS="cockpit-bridge"
RPM_REQUIRES="cockpit-bridge"

# What the package owns below the staged root (directories are taken whole).
FILES="/usr/share/cockpit/status-board
/usr/share/metainfo/de.azentrius.status_board.metainfo.xml
/usr/share/doc/cockpit-status-board"
