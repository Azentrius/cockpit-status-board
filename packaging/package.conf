# What tools/build-packages.sh needs to know about this package (sourced by sh).
# SPDX-License-Identifier: Apache-2.0

NAME=cockpit-status-board
SUMMARY="Cockpit page with the status of the Azentrius add-ons on every host"
DESCRIPTION="One row per host of Cockpit's host switcher, one tile per Azentrius add-on: its state, its most important figure and the age of its data. Hosts that do not answer, locked SSH keys, add-ons missing on a host and data that is out of date show up as well. Read-only: it runs only each add-on's status verb and asks for no administrative access. Meant for the Cockpit host that reaches the others."
HOMEPAGE=https://github.com/Azentrius/cockpit-status-board
MAINTAINER="Azentrius <support@azentrius.com>"
LICENSE="Apache-2.0 AND OFL-1.1 AND CC-BY-4.0"

# One dependency per line. The page runs in Cockpit and needs nothing else here; the hosts it
# shows need cockpit-bridge and the add-ons, not this package.
DEB_DEPENDS="cockpit-bridge"
RPM_REQUIRES="cockpit-bridge"

# What the package owns below the staged root (directories are taken whole).
FILES="/usr/share/cockpit/status-board
/usr/share/metainfo/de.azentrius.status_board.metainfo.xml
/usr/share/doc/cockpit-status-board"
